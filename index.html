<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Splitsecond</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="wrap">
  <header>
    <h1>Splitsecond</h1>
    <p class="puzzle-tag">Puzzle #<span id="puzzle-num">1</span> · new problems daily</p>
  </header>

  <section id="screen-select" class="screen">
    <p class="prompt">Pick a level. Answer as many as you can before the timer runs out.</p>
    <div class="level-grid">
      <button class="level-btn" data-level="easy">
        <span class="level-name">Easy</span>
        <span class="level-meta">Elementary · 10 questions · 60s</span>
      </button>
      <button class="level-btn" data-level="medium">
        <span class="level-name">Medium</span>
        <span class="level-meta">Middle/High School · 10 questions · 75s</span>
      </button>
      <button class="level-btn" data-level="hard">
        <span class="level-name">Hard</span>
        <span class="level-meta">Adult · 10 questions · 90s</span>
      </button>
    </div>
  </section>

  <section id="screen-game" class="screen hidden">
    <div class="game-top">
      <span id="level-label" class="badge"></span>
      <span class="q-progress">Q<span id="q-index">1</span>/<span id="q-count">10</span></span>
      <span class="timer-wrap">
        <span class="timer-icon" aria-hidden="true">⏱</span>
        <span id="timer" class="timer">60s</span>
      </span>
    </div>
    <div class="question-box">
      <div id="question" class="question"></div>
      <input id="answer-input" type="number" inputmode="numeric" placeholder="answer" autocomplete="off" />
      <button id="submit-btn">Submit</button>
    </div>
    <p id="feedback" class="feedback"></p>
  </section>

  <section id="screen-result" class="screen hidden">
    <h2 id="result-title"></h2>
    <div id="result-grid" class="result-grid"></div>
    <p id="result-score" class="result-line"></p>
    <p id="result-time" class="result-line"></p>
    <div class="future-slot">
      <p class="future-slot-label">Streak &amp; leaderboard — coming soon</p>
    </div>
    <div class="result-actions">
      <button id="share-btn">Share result</button>
      <button id="play-again-btn">Try another level</button>
    </div>
  </section>
</main>

<script src="js/seed.js"></script>
<script src="js/problems.js"></script>
<script src="js/share.js"></script>
<script src="js/game.js"></script>
</body>
</html>
